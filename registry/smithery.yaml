name: tako-mcp
title: Tako MCP Server
description: |
  Tako MCP gives your agent premium live data from authoritative providers
  and web search in one call, returned as cited charts and web results.
  The data covers finance, markets, company KPIs, economics, website
  traffic, sports, prediction markets, demographics, energy, real estate,
  and more.
version: 1.8.0
license: MIT
author:
  name: Tako
  email: hello@tako.com
  url: https://tako.com
repository: https://github.com/TakoData/tako-mcp
categories:
  - Data Visualization
  - Charts
  - Data Analysis
  - Knowledge Base
tags:
  - charts
  - data-visualization
  - knowledge-base
server:
  type: remote
  transport: streamable-http
  url: https://mcp.tako.com/mcp
authentication:
  type: oauth2
  description: >
    Web hosts authenticate via the server's OAuth flow. CLI/desktop hosts may
    instead pass a Tako API token (from tako.com account settings) as a Bearer
    credential — set the optional takoApiToken below.
configSchema:
  type: object
  required: []
  properties:
    takoApiToken:
      type: string
      title: Tako API Token
      description: >
        Optional. A Tako API token for the Bearer auth path used by CLI/desktop
        hosts. Sign up at tako.com and create a token in your account settings.
        Web hosts can ignore this and use OAuth instead.
tools:
  - name: tako_search
    description: >-
      Search premium data from authoritative providers and the live web in one
      call. Returns cited cards that render as charts, plus web results.
  - name: tako_available_data
    description: >-
      Report what data Tako holds on an entity or metric, including a metric's
      exact name to search for.
  - name: tako_search_advanced
    description: >-
      The whole v3 search request body, plus `include_answer: true` for one
      synthesized, citation-backed answer from Tako and/or the web. Opt-in — add
      the `search_advanced` token to the server URL's ?tools= allowlist, which
      replaces the default listing, so name the other tools you want too
      (?tools=search,available_data,contents,search_advanced). Most hosts should
      prefer tako_search and synthesize the answer themselves.
  - name: tako_contents
    description: >-
      Fetch the full content behind a url: a web page's text, or an exportable
      Tako card's data rows. Batch several urls in one call.
  - name: tako_visualize
    description: >-
      Create a card from your own structured data. The card is public and
      permanent — anyone with the returned url can open it without signing in.
      Opt-in — add the `visualize` token to the server URL's ?tools= allowlist,
      which replaces the default listing, so name the other tools you want too
      (?tools=search,contents,visualize). Already on by default at
      https://mcp.tako.com/mcp/chatgpt, which serves the chart widget.
  - name: tako_agent
    description: >-
      Run Tako's Answer Agent — multi-step research with Tako's data and the
      web; returns a cited answer plus chart cards. Opt-in — add the `agent`
      token to the server URL's ?tools= allowlist, which replaces the default
      listing, so name the other tools you want too
      (?tools=search,available_data,agent).
  - name: tako_company_agent
    description: >-
      Run Tako's Company Agent to build a list of companies or people, such as
      companies by location, industry, status, founding date, funding stage, or
      size, or the officers, directors, owners, or employees of those companies.
      It returns a cited answer plus list cards. Opt-in: add the `company_agent`
      token to the server URL's ?tools= allowlist. The allowlist replaces the
      default listing, so name the other tools you want too
      (?tools=search,available_data,company_agent).
  - name: tako_graph_related
    description: >-
      Explore what a Tako graph node connects to — its metrics, the entities a
      metric covers, competitors, memberships, and sources. Free, and listed by
      default.
examples:
  - title: Search for Charts
    description: Find existing visualizations on any topic
    input: |
      {"query": "US GDP growth rate"}
  - title: See What Data Tako Has
    description: >-
      Find what data Tako holds on an entity or metric, including a metric's
      exact name to search for
    input: |
      {"q": "Tesla"}
links:
  homepage: https://tako.com
  documentation: https://github.com/TakoData/tako-mcp#readme
  api_reference: https://tako.com/docs/
  changelog: https://github.com/TakoData/tako-mcp/releases

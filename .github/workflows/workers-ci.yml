name: workers-ci

on:
  # The rule, stated as the property that actually prevents a skipped guard:
  # every file a guard READS must be a trigger path. (Not the converse — that
  # every trigger path is guarded, which is the weaker reading and lets a gap
  # through.)
  #
  # This list is no longer maintained by hand alone: `scripts/ci_paths.test.ts`
  # parses the `paths:` blocks below and fails if any file a guard READS is not
  # matched by some pattern. `GUARD_INPUT_PATHS` in `gen-registry.ts` is the
  # read-set it checks against. Add a guard input there and CI tells you to add
  # the trigger path here.
  #
  # What reads what: `registry:check` reads `registry/metadata.json`,
  # `registry/smithery.yaml`, `agent.json`, `llms-full.txt`, `llms.txt`,
  # `README.md`, `skills/**`, `chatgpt-app-submission.json`,
  # `chatgpt-app-snapshot.json`, `registry/lhm.plugin.json`,
  # `registry/server.json`, `workers/src/tools/_registry.ts` and
  # `docs/TOOLS.md` (see `gen-registry.ts` — `assertChatgptSubmissionParity`,
  # `assertChatgptSnapshot`, `assertLlmsFullCoverage`, `assertPinFormInDocs`,
  # the `2c` disclosure check, and the drift comparisons);
  # `scripts/skills.test.ts` reads `skills/**`, `.claude-plugin/**`,
  # `version.txt`, and `README.md` again (the SKILL.md frontmatter must match
  # the README's copy-paste blocks byte for byte);
  # `scripts/gemini-extension.test.ts` reads `gemini-extension.json`,
  # `commands/**`, `docs/gemini/**`, and `version.txt`;
  # `scripts/ci_paths.test.ts` reads THIS FILE, which is why it is listed
  # below — a check that cannot see its own input is a check you can delete
  # in a PR that runs nothing.
  #
  # `skills/**` and `.claude-plugin/**` were missing here, and that is how a
  # skill with unparseable YAML frontmatter shipped: the edit that broke it
  # touched no triggering path, so CI never ran on the PR at all. `README.md`
  # was missing for the same reason and is now the input to two guards, so a
  # README-only PR must run them. Then `chatgpt-app-snapshot.json`,
  # `docs/TOOLS.md` and `agent.json` were missing — a snapshot-digest-only PR,
  # which is exactly how you would silence the ChatGPT drift guard, ran no CI.
  # Three recurrences is why the check above exists. The fourth was the check
  # itself: it read this file without listing it, so deleting a path here ran
  # no `typecheck-and-test` and the check never objected.
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'registry/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - 'gemini-extension.json'
      - 'commands/**'
      - 'docs/gemini/**'
      - 'chatgpt-app-submission.json'
      - 'chatgpt-app-snapshot.json'
      - 'agent.json'
      - 'docs/TOOLS.md'
      - 'llms-full.txt'
      - 'llms.txt'
      - 'README.md'
      - 'version.txt'
      - '.github/workflows/workers-ci.yml'
  pull_request:
    paths:
      - 'workers/**'
      - 'registry/**'
      - 'skills/**'
      - '.claude-plugin/**'
      - 'gemini-extension.json'
      - 'commands/**'
      - 'docs/gemini/**'
      - 'chatgpt-app-submission.json'
      - 'chatgpt-app-snapshot.json'
      - 'agent.json'
      - 'docs/TOOLS.md'
      - 'llms-full.txt'
      - 'llms.txt'
      - 'README.md'
      - 'version.txt'
      - '.github/workflows/workers-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: typecheck-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: workers/.nvmrc
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Schema drift guard. `schemas:gen` writes `workers/src/generated/schemas.ts`
      # from the OpenAPI spec. Check mode regenerates in-memory and exits
      # non-zero on any drift — so a spec edit that forgets to run
      # `npm run schemas:gen` fails the PR here instead of shipping stale schemas.
      - name: Check generated schemas are up to date
        working-directory: workers
        run: npm run schemas:check

      # Registry drift guard. `registry:gen` writes `registry/server.json`
      # and `workers/src/tools/_registry.ts` from the Zod schemas + annotations
      # in `workers/src/tools/*.ts`. Check mode regenerates in-memory and
      # exits non-zero on any drift — so a tool edit that forgets to run
      # `npm run registry:gen` fails the PR here instead of shipping a
      # stale registry or barrel.
      - name: Registry check
        run: npm run registry:check

      # Validate wrangler.jsonc without publishing. Catches invalid
      # compatibility dates, unknown fields, or missing `main` before they
      # break a real deploy. `--dry-run` skips auth and upload; we run it
      # against both envs because they have independent `name`/`vars`
      # overrides that can drift separately.
      - name: Validate wrangler config (staging)
        run: npx wrangler deploy --dry-run --env staging

      - name: Validate wrangler config (production)
        run: npx wrangler deploy --dry-run --env production

name: Regenerate from synced OpenAPI spec

on:
  pull_request:
    paths:
      - 'openapi/sdk.yaml'

permissions:
  contents: write

concurrency:
  group: regenerate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Only on same-repo PRs (the auto/openapi-sync branch from the App); skip forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: workers/.nvmrc
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate schemas + registry
        run: |
          npm run schemas:gen
          # Tee'd so the commit step can put the parameter summary in the
          # message. `tako_search_advanced` derives its schema from the
          # generated components, so a backend field reaches a published tool
          # through THIS commit and nowhere else — the spec diff shows a schema
          # change, not which tool grew a parameter.
          npm run registry:gen | tee "${RUNNER_TEMP}/registry-gen.log"

      - name: Verify
        run: |
          npm run schemas:check
          npm run registry:check
          npm run typecheck
          npm test

      # Push with the default GITHUB_TOKEN deliberately: commits it authors do
      # NOT re-trigger `on: pull_request`/`push` workflows (GitHub anti-recursion),
      # which is what keeps this job from re-triggering itself in a loop. The
      # trade-off: `workers-ci.yml` does not re-run on this regen commit, so the
      # final SHA is verified by the `Verify` step above (same checks) rather than
      # by a separate `workers-ci` status. `main` has no required status checks
      # today, so this does not block merge. If branch protection later requires
      # `workers-ci`, switch this push to the OPENAPI_SYNC_APP installation token
      # (needs the App id/key as repo secrets) so the standard checks re-fire.
      - name: Commit regenerated code
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "tako-bot"
          git config user.email "bot@tako.com"
          # Must list EVERY artifact `registry:gen` writes, minus the snapshot.
          # The `Verify` step above cannot catch an omission: it runs
          # `registry:check` against the UNCOMMITTED tree, so a file the
          # generator rewrote but nobody staged looks correct there and ships
          # stale. `predeploy:staging` re-runs the same check on a clean
          # checkout, so the omission surfaces as a blocked deploy instead of a
          # red sync PR. Current outputs: registry/server.json,
          # registry/lhm.plugin.json, workers/src/tools/_registry.ts and
          # docs/TOOLS.md (see the writeFileSync block in gen-registry.ts).
          # `chatgpt-app-snapshot.json` is deliberately NOT staged — it changes
          # only under `--accept`, which a bot must never do to a
          # reviewed-surface digest.
          git add workers/src/generated/schemas.ts workers/src/tools/_registry.ts \
            registry/server.json registry/lhm.plugin.json docs/TOOLS.md
          PARAMS=$(grep '^\[registry:gen\] parameters ' "${RUNNER_TEMP}/registry-gen.log" | sed 's/^\[registry:gen\] parameters //' || true)
          if ! git diff --cached --quiet; then
            if [ -n "$PARAMS" ]; then
              git commit -m "chore: regenerate schemas + registry from synced spec" \
                -m "Parameter changes on published tools:" -m "$PARAMS"
            else
              git commit -m "chore: regenerate schemas + registry from synced spec"
            fi
            git push origin "HEAD:$HEAD_REF"
          fi

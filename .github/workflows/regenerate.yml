name: Regenerate from synced OpenAPI spec

on:
  pull_request:
    paths:
      - 'openapi/sdk.yaml'

permissions:
  contents: write

concurrency:
  group: regenerate-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Only on same-repo PRs (the auto/openapi-sync branch from the App); skip forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    defaults:
      run:
        working-directory: workers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: workers/.nvmrc
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Regenerate schemas + registry
        run: |
          npm run schemas:gen
          npm run registry:gen

      - name: Verify
        run: |
          npm run schemas:check
          npm run registry:check
          npm run typecheck
          npm test

      # Push with the default GITHUB_TOKEN deliberately: commits it authors do
      # NOT re-trigger `on: pull_request`/`push` workflows (GitHub anti-recursion),
      # which is what keeps this job from re-triggering itself in a loop. The
      # trade-off: `workers-ci.yml` does not re-run on this regen commit, so the
      # final SHA is verified by the `Verify` step above (same checks) rather than
      # by a separate `workers-ci` status. `main` has no required status checks
      # today, so this does not block merge. If branch protection later requires
      # `workers-ci`, switch this push to the OPENAPI_SYNC_APP installation token
      # (needs the App id/key as repo secrets) so the standard checks re-fire.
      #
      # `Verify` runs against the WORKING TREE, not the commit this step creates,
      # so it passes no matter which generated files the `git add` below forgets.
      # Only the leftover guard covers that gap.
      - name: Commit regenerated code
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "tako-bot"
          git config user.email "bot@tako.com"
          # Every path the generators write must appear here. gen-registry.ts
          # writes three (registry/server.json, workers/src/tools/_registry.ts,
          # registry/lhm.plugin.json) and gen-schemas.ts writes one; omitting
          # lhm.plugin.json shipped a commit whose own `registry:check` failed in
          # workers-ci while this job stayed green (PR #214).
          git add workers/src/generated/schemas.ts workers/src/tools/_registry.ts registry/server.json registry/lhm.plugin.json
          # A generated file left unstaged means the list above is incomplete: the
          # push would land a commit that fails `registry:check`/`schemas:check`.
          # Compare unstaged tracked edits and new untracked files, NOT
          # `git status --porcelain`, which also reports the paths just staged and
          # would fire on every run that has anything to commit.
          LEFTOVER="$(git diff --name-only; git ls-files --others --exclude-standard)"
          if [ -n "$LEFTOVER" ]; then
            echo "::error::generators wrote files missing from the git add list above:"
            echo "$LEFTOVER"
            exit 1
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate schemas + registry from synced spec"
            git push origin "HEAD:$HEAD_REF"
          fi

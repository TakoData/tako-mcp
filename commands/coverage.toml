description = "Check what proprietary data Tako has on an entity or metric (free, no credits spent)"

prompt = """
Check Tako's coverage for: {{args}}

Call `tako_available_data`. It is free and fast, so this is the cheap way to find out
whether a figure exists before spending a priced search or answer.

Scope matters here: this probes the **proprietary data graph only**, not Tako's web search.
A miss means the figure is not available as a typed series with a named provider. It does
not mean Tako cannot answer the question, because `tako_search` and `tako_answer` search the
full web in the same call by default.

Report:

- Whether Tako has it, and the **exact metric names** it reports as covered. Those names
  are what a follow-up `tako_search` or `tako_answer` should use verbatim.
- The `node_id` worth pinning, if one came back.
- The ready-to-run `next_call`, if the tool returned one.

Be honest about a miss: if the coverage names that come back do not actually match what
was asked for, say the curated data is not there rather than proposing the nearest
lookalike. A name that resolves is not the same as a name that retrieves rows. Then say
what to do instead. A `tako_search` that leans on the web half is usually the next move.
"""

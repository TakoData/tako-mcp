      title: EntityClassName
    ErrorObject:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
      type: object
      required:
      - code
      - message
      title: ErrorObject
    ExportPricing:
      properties:
        baseline_usd:
          type: number
          title: Baseline Usd
          description: Flat USD charged once per card export, independent of row count.
        row_cpm_usd:
          type: number
          title: Row Cpm Usd
          description: USD charged per 1,000 rows on rows beyond the free allowance
            (free_rows). Card-level rate, set by the card's most expensive source;
            no per-source breakdown.
        free_rows:
          type: integer
          title: Free Rows
          description: Rows included at the baseline price before the per-1,000-row
            rate (row_cpm_usd) begins to apply. This is the /contents free row allowance
            for your account. A search or answer response bills an inlined card against
            this same allowance.
        max_rows_ceiling:
          type: integer
          title: Max Rows Ceiling
          description: Hard cap on rows a single export can return and bill; a larger
            requested max_rows is clamped to this. No format bills more than the clamped
            max_rows, and none bills more rows than it returns. Every format obeys
            this ceiling, including card_json.
      type: object
      required:
      - baseline_usd
      - row_cpm_usd
      - free_rows
      - max_rows_ceiling
      title: ExportPricing
      description: 'Card-CSV export pricing RATE for the /contents endpoint, published
        so a

        caller can compute an export''s cost before fetching. A /contents export

        charge = baseline_usd + row_cpm_usd * max(0, rows - free_rows) / 1000,

        rows <= max_rows_ceiling. row_cpm_usd is the card-level rate: the

        per-1,000-row rate of the card''s most expensive source (TAKO-3916 — a card

        costs its most expensive source, never a sum); no per-source breakdown.


        `free_rows` here is the CALLER''S allowance, the same number a billed inline

        card''s `cost` uses -- both resolve through tako_free_rows_for. The two agreed

        only after /contents gained an entitlement concept; before that this field
        was

        always CSV_FREE_ROWS and the two surfaces disagreed by 3x on the same rows.'
    GeoLocation:
      properties:
        latitude:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Latitude
          description: Latitude of the end user (degrees, -90 to 90).
        longitude:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Longitude
          description: Longitude of the end user (degrees, -180 to 180).
      additionalProperties: false
      type: object
      required:
      - latitude
      - longitude
      title: GeoLocation
    GraphNode:
      properties:
        id:
          type: string
          title: Id
          description: Opaque, human-friendly public id (<prefix>::<name>::<hash>,
            where prefix is ent for an entity or mt for a metric). Ids are not durable
            across knowledge-graph rebuilds — resolve them at request time rather
            than storing them.
        type:
          $ref: '#/components/schemas/GraphNodeType'
        name:
          type: string
          title: Name
        aliases:
          items:
            type: string
          type: array
          title: Aliases
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        subtype:
          anyOf:
          - $ref: '#/components/schemas/EntityClassName'
          - type: 'null'
        label:
          anyOf:
          - $ref: '#/components/schemas/NerLabel'
          - type: 'null'
          description: Public NER label of the node (PERSON, ORG, GPE, ...). Derived
            from the node's stored annotation; null when the internal annotation has
            no public equivalent.
      type: object
      required:
      - id
      - type
      - name
      title: GraphNode
    GraphNodeType:
      type: string
      enum:
      - metric
      - entity
      title: GraphNodeType
    GraphRelatedResponse:
      properties:
        node:
          $ref: '#/components/schemas/GraphNode'
        relations:
          anyOf:
          - items:
              $ref: '#/components/schemas/GraphRelation'
            type: array
          - type: 'null'
          title: Relations
        relation:
          anyOf:
          - $ref: '#/components/schemas/GraphRelationPage'
          - type: 'null'
        inferred_labels:
          anyOf:
          - items:
              $ref: '#/components/schemas/NerLabel'
            type: array
          - type: 'null'
          title: Inferred Labels
          description: Labels that Tako NER inferred from `q` when infer_label ran
            (boost applied). An empty list means inference ran and found nothing.
            The field is absent when you supplied an explicit `label`, when infer_label=false,
            or when there was no q.
      type: object
      required:
      - node
      title: GraphRelatedResponse
    GraphRelation:
      properties:
        key:
          type: string
          title: Key
          description: 'Stable pagination handle. Fixed keys: metrics, entities, siblings,
            part_of, members. Named relations: rel:<phrase>.'
        kind:
          $ref: '#/components/schemas/RelationKind'
        label:
          type: string
          title: Label
          description: Human-readable group label.
        items:
          items:
            $ref: '#/components/schemas/GraphNode'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        total_capped:
          type: boolean
          title: Total Capped
          description: True when `total` hit the server-side fetch cap; the true count
            is at least `total`. Render as 'total+'.
          default: false
      type: object
      required:
      - key
      - kind
      - label
      - items
      - total
      title: GraphRelation
    GraphRelationPage:
      properties:
        key:
          type: string
          title: Key
          description: The relation key of this page.
        kind:
          $ref: '#/components/schemas/RelationKind'
        label:
          type: string
          title: Label
          description: Human-readable group label.
        items:
          items:
            $ref: '#/components/schemas/GraphNode'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        total_capped:
          type: boolean
          title: Total Capped
          description: True when `total` hit the server-side fetch cap; the true count
            is at least `total`. Pagination ends at the cap — narrow with `q` to reach
            the tail.
          default: false
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - key
      - kind
      - label
      - items
      - total
      title: GraphRelationPage
    GraphSearchResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/GraphNode'
          type: array
          title: Results
        inferred_labels:
          anyOf:
          - items:
              $ref: '#/components/schemas/NerLabel'
            type: array
          - type: 'null'
          title: Inferred Labels
          description: Labels that Tako NER inferred from `q` when infer_label ran
            (boost applied). An empty list means inference ran and found nothing.
            The field is absent when you supplied an explicit `label`, when infer_label=false,
            or when there was no q.
      type: object
      required:
      - results
      title: GraphSearchResponse
    HeartbeatEvent:
      properties:
        kind:
          type: string
          const: heartbeat
          title: Kind
          default: heartbeat
      type: object
      title: HeartbeatEvent
    KnowledgeCardMethodology:

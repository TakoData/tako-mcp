    OutputSettings:
      properties:
        image_dark_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Image Dark Mode
          description: Whether to render card preview images in dark mode.
        force_refresh:
          type: boolean
          title: Force Refresh
          description: 'Instant mode only, and currently informational: on these endpoints,
            instant (effort=''instant'') always operates in build-and-refresh mode
            regardless of this flag. Instant retrieves data for embeds that are missing
            or stale, then creates or refreshes their static embeds. Embeds that are
            already fresh (within the refresh cadence) return as-is; Tako does not
            re-retrieve them. Identical queries therefore reuse the same content-addressed
            embed and return a stable embed URL.'
          default: false
      additionalProperties: false
      type: object
      title: OutputSettings
    ReasoningEvent:
      properties:
        kind:
          type: string
          const: reasoning
          title: Kind
          default: reasoning
        id:
          type: string
          title: Id
        delta:
          type: string
          title: Delta
        done:
          type: boolean
          title: Done
          default: false
      type: object
      required:
      - id
      - delta
      title: ReasoningEvent
    RelatedSuggestion:
      properties:
        query:
          type: string
          title: Query
          description: The follow-up query. Send it as the `query` of another search
            request.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: What the query asks for, in words. Tako sets this only when
            the query text does not say on its own, such as a lookup by identifier.
            Most suggestions omit it because the query already reads as a question.
            Tako composes it from the data on the card; no language model writes it.
        node_ids:
          items:
            type: string
          type: array
          title: Node Ids
          description: Graph node ids that identify the data this query asks for.
            Pass them as `sources.data.node_ids` on the follow-up search to make the
            search return that data. The list is empty when Tako cannot resolve the
            ids; the query still works on its own.
      type: object
      required:
      - query
      title: RelatedSuggestion
      description: 'One follow-up query for the caller to run next.


        A suggestion is deterministic. Tako derives it either from the data a

        returned card already holds, or from the knowledge graph around that card.

        No language model writes these.'
    RelationKind:
      type: string
      enum:
      - related
      - data
      - sibling
      - membership
      title: RelationKind
      description: How Tako derived a relation group.
    ResultContent:
      properties:
        content_format:
          anyOf:
          - $ref: '#/components/schemas/ContentsFormat'
          - type: 'null'
          description: 'Serialization of the returned card data: ''csv'', ''json_records'',
            ''json_compact'', or ''card_json''. Null for web text (always returned
            as raw text) and for a quote-only response (nothing was serialized).'
        cost:
          type: number
          title: Cost
          description: 'Price of this item in USD. On a /contents response this is
            the amount actually billed. On a quote_only response it is a prospective
            /contents export price, because Tako fetched nothing and billed nothing.
            On a search or answer downloadable card it is also a prospective price,
            unless Tako returned more rows than the free row allowance; then it is
            the amount this response billed for the card. Use export_pricing on its
            own to price a /contents export of the same card. Do not add this value
            to that result: they are two prices for the same rows, not two charges.'
          default: 0.0
        data:
          anyOf:
          - type: string
          - type: 'null'
          title: Data
          description: 'Inline payload as text: card data serialized to CSV, or a
            web page''s extracted text. Set only for the ''csv'' card format and for
            web text; null otherwise.'
        records:
          anyOf:
          - items:
              additionalProperties:
                anyOf:
                - type: string
                - type: number
                - type: integer
                - type: boolean
                - type: 'null'
              type: object
            type: array
          - type: 'null'
          title: Records
          description: 'Inline card data as verbose JSON: a list of row objects keyed
            by column name. Set only when content_format is ''json_records''.'
        dataset:
          anyOf:
          - $ref: '#/components/schemas/TakoDataset'
          - type: 'null'
          description: Inline card data as a compact TakoDataset (typed column headers
            plus positional row arrays). Set only when content_format is 'json_compact'.
        card_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Card Data
          description: 'Inline card data as a card-type-specific JSON object. The
            ''card_type'' field inside the object names its shape. Set only when content_format
            is ''card_json''. Tako truncates the record rows in the object to ''max_rows'',
            the same cap every other format takes, and bills the rows it returns.
            A card whose record array is unbounded caps that array at the platform
            export ceiling and reports ''truncated'': true. The payload then also
            carries the true count for its record array. Card types without a card_json
            shape return 422 on /contents and fall back to ''json_compact'' on search
            and answer include_contents.'
        card_data_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Card Data Schema
          description: 'JSON Schema for the object in ''card_data''. Read it to learn
            the shape of the payload without parsing the payload. Tako sets this whenever
            content_format is ''card_json''. It is also set in ''url'' delivery mode
            and on a Contents quote, where ''card_data'' is null and the shape is
            all Tako returns. A search or answer card that you did not ask to inline
            carries a price but no schema. The ''title'' field and the ''card_type''
            default inside the schema name the shape. The schema describes the payload
            type, so ''card_data'' can omit a field the schema declares: Tako drops
            a measure the provider did not supply. Null for every other content_format
            and for web text.'
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: Presigned download URL for the content, returned in 'url' delivery
            mode. Null for inline delivery and for quotes; pair with expires_at.
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: ISO-8601 timestamp after which the presigned url stops working.
            Null whenever url is null.
        total_rows:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total Rows
          description: True total number of rows in the card's data, independent of
            how many rows were returned. Compare with truncated to tell whether more
            rows are available via a larger max_rows. Null for web text.
        truncated:
          type: boolean
          title: Truncated
          description: True when Tako capped the returned rows and total_rows is larger
            than the number returned. Tako caps a card at the request max_rows or
            at the 2,000-row system ceiling. On a search or answer response, Tako
            also applies a budget of 2,000 billable rows that all cards in the response
            share, so it can return fewer rows for a later card than max_rows asked
            for. Rows within the free row allowance do not use that budget, so a request
            that omits max_rows is never capped by it.
          default: false
        export_pricing:
          anyOf:
          - $ref: '#/components/schemas/ExportPricing'
          - type: 'null'
          description: Rate card for a downloadable card CSV, so a caller can compute
            a full export's cost before fetching. Null for web text and other non-downloadable
            content.
        manifest:
          anyOf:
          - items:
              $ref: '#/components/schemas/ColumnDescriptor'
            type: array
          - type: 'null'
          title: Manifest
          description: 'Per-column metadata, one entry per exported column, in column
            order: entry i describes column i (CSV header i, json_records key i, or
            dataset.columns[i]). Each entry carries name (the column header), dtype,
            unit, metric, and entity. Null for web or quote responses that carry no
            tabular columns.'
      type: object
      title: ResultContent
      description: 'Describes the downloadable content behind a result.


        Pricing: for a Tako card CSV export, the charge is a flat per-export

        baseline plus a per-row CPM, at the rate of the card''s most expensive

        source, on the rows returned beyond the free row allowance. Web text bills

        at the standard Contents rate.


        The meaning of `cost` depends on the surface. On `/contents` responses,

        `cost` is the actual charge, and it reconciles with what that response

        billed. The exception is a `quote_only` response, where `cost` is a

        prospective price: Tako neither fetched nor billed the export, and the

        payload and url fields are null. On a search or answer downloadable

        card, `cost` is a prospective `/contents` quote (the per-export baseline

        floor) unless Tako returned more rows than the caller''s free row

        allowance, in which case it is what this response billed for the card. The

        billed cards sum to `usage.data.cost_usd`, never to

        `usage.total_cost_usd` (which always adds the flat per-request compute

        rate), and only when no web contents were inlined, because every web fetch

        charge lands in that same `data` field.


        `export_pricing` carries the `/contents` export rate, so a caller can

        compute the full charge of a later export before fetching: baseline_usd +

        row_cpm_usd * max(0, billed_rows - free_rows) / 1000, where `billed_rows`
        is

        the SMALLER of the rows the export returns and `max_rows` clamped to

        `max_rows_ceiling`. One formula covers every format, card_json included:

        every export returns no more rows than that cap, so a card with fewer rows

        than the cap bills only the rows it returns. That rate uses the CALLER''S
        free

        row allowance, the same one a billed inline card''s `cost` uses -- /contents

        resolves the caller''s entitlement too. `export_pricing` is null for web text

        and non-downloadable content.


        Do NOT combine `cost` with `export_pricing` on a billed inline card. There,

        `cost` is the amount THIS response charged, computed against the caller''s

        own inline free row allowance, so it is not a `/contents` price. For a

        caller whose inline allowance is larger than the `/contents` allowance the

        two fields disagree, because the inline charge starts above the larger

        allowance and the published `/contents` formula starts above the smaller

        one. Read `cost` for what this response billed. Use `export_pricing` alone

        to price a `/contents` export of the same card.


        Tako populates exactly one payload group once it delivers contents:

        `data` (CSV or web text), `records` (verbose JSON), `dataset` (compact

        TakoDataset), `card_data` (rich card-type-specific JSON), or `url` plus

        `expires_at` (presigned download).

        `content_format` names the serialization; it is null for web text and

        for an undelivered quote. Read `content_format` to tell a quote from a

        delivery: when it is null, this is just the quote (`cost`); fetch the

        content later via the Contents endpoint.


        Do NOT use "every payload field is null" as that test. `card_data_schema`

        is set on a card_json quote and on a card_json `url` delivery, where

        `card_data` is null, so a caller reading absent payloads as "quote" reads

        those two as quotes.'
    RetrievalAgentEffort:
      type: string
      enum:
      - medium
      title: RetrievalAgentEffort
      description: 'Effort taxonomy for the Retrieval Agent (POST /v1/agent/retrieval/runs).


        Only ''medium'' is available today. `effort` stays a request field for

        forward compatibility and for parity with AnswerAgentEffort. The values

        ''low'' and ''high'' return 400 at validation.'
    RetrievalAgentResult:
      properties:
        answer:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer
        cards:
          items:
            $ref: '#/components/schemas/TakoCard'
          type: array
          title: Cards
        citations:
          items:
            $ref: '#/components/schemas/AgentAnswerCitation'
          type: array
          title: Citations
        metadata:
          anyOf:
          - $ref: '#/components/schemas/AgentAnswerMetadata'
          - type: 'null'
        structured_output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Structured Output
          description: Caller-shaped structured output (present only if the request
            carried output_schema and status is not 'failed'). Dataset slots contain
            a TakoDataset envelope of exact retrieved rows, or null when the agent
            left them unfilled.
        structured_output_status:
          anyOf:
          - $ref: '#/components/schemas/StructuredOutputStatus'
          - type: 'null'
          description: complete | partial | failed. Present when the request supplied
            output_schema and the run reached the finalize step. It can be absent
            when the whole run failed or timed out before finalize; the run-level
            status and error convey that, and the echoed request.output_schema still
            identifies the run as structured.
        structured_output_citations:
          anyOf:
          - additionalProperties:
              items:
                type: integer
              type: array
            type: object
          - type: 'null'
          title: Structured Output Citations
          description: Best-effort field-path -> citation-index map joining the top-level
            citations registry (same [n] index space as the answer). Absent when status
            is 'failed'.
        unfilled_fields:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Unfilled Fields
          description: Dot-separated paths of unfilled dataset slots; present only
            if status is 'partial'.
        structured_output_error:
          anyOf:
          - $ref: '#/components/schemas/ErrorObject'
          - type: 'null'
          description: Why structured output failed; present only if status is 'failed'.
        refusal_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Refusal Code
          description: Set when Tako rejected the query before the agent ran. Null
            on normal runs. Tako can add new codes, so accept a code you do not recognize.
            The current code is 'rejected_input_classifier'.
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      type: object
      title: RetrievalAgentResult
      description: 'Final retrieval-agent output. answer is markdown prose with [n]

        citation markers. cards reuse the sibling TakoCard. citations is the

        unified top-level registry for data and web sources — there is no

        web_results field. metadata carries definitions, assumptions, and

        methodology. The structured_output_* fields carry the caller-shaped

        output_schema result; they are present only if the request supplied

        output_schema. See each field''s description for the exact presence

        rules.'
    RetrievalAgentResultEvent:
      properties:
        kind:
          type: string
          const: agent_result
          title: Kind
          default: agent_result
        id:
          type: string
          title: Id
        data:
          $ref: '#/components/schemas/RetrievalAgentResult'
      type: object
      required:
      - id
      - data
      title: RetrievalAgentResultEvent
    RetrievalAgentRun:
      properties:
        run_id:
          type: string
          title: Run Id
        object:
          type: string
          const: agent.retrieval.run
          title: Object
          default: agent.retrieval.run
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread Id
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        created_at:
          type: string
          title: Created At
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        result:
          anyOf:
          - $ref: '#/components/schemas/RetrievalAgentResult'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorObject'
          - type: 'null'
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
        request:
          anyOf:
          - $ref: '#/components/schemas/RetrievalAgentRunRequest'
          - type: 'null'
      type: object
      required:
      - run_id
      - status
      - created_at
      title: RetrievalAgentRun
      description: The retrieval-agent run resource returned by dispatch (202) and
        poll (GET).
    RetrievalAgentRunList:
      properties:
        object:
          type: string
          const: list
          title: Object
          default: list
        data:
          items:
            $ref: '#/components/schemas/RetrievalAgentRunSummary'
          type: array
          title: Data
        has_more:
          type: boolean
          title: Has More
          default: false
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - data
      title: RetrievalAgentRunList
      description: 'List envelope for GET /v1/agent/retrieval/runs. The shape follows
        the

        OpenAI and Exa list convention.'
    RetrievalAgentRunRequest:
      properties:
        query:
          type: string
          title: Query
          description: Natural-language data-retrieval request for the retrieval agent.
          examples:
          - S&P 500 semiconductor companies' 2024 revenue and YoY growth
        thread_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Thread Id
          description: Existing thread to continue (follow-up). Omit to start a new
            thread.
        effort:
          $ref: '#/components/schemas/RetrievalAgentEffort'
          description: Retrieval-agent effort. Only 'medium' is currently supported.
          default: medium
        source_indexes:
          items:
            type: string
            enum:
            - data
            - web
          type: array
          title: Source Indexes
          description: 'Which sources the agent may use: ''data'' (curated knowledge),
            ''web'' (open-web search), or both. Defaults to [''data'', ''web'']. Tako
            accepts the legacy value ''tako'' as a synonym for ''data''.'
          examples:
          - - data
          - - web
          - - data
            - web
        cards:
          type: boolean
          title: Cards
          description: 'Whether the agent may build visualization cards. The default
            is true and permissive: the agent may build cards, but it does not have
            to (a completed run with no cards is legitimate). Set false to suppress
            card building entirely.'
          default: true
        output_schema:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Output Schema
          description: 'JSON Schema for structured output. The agent writes the synthesized
            fields. Dataset slots (marked with x-tako-dataset: true) receive exact
            retrieved rows as a TakoDataset. Supported subset: the object, array,
            string, number, integer, and boolean types, plus enum, required, and description.
            Caps: 16KB, depth 5, 64 properties, 4 dataset slots. Violations return
            400 output_schema_invalid.'
        locale:
          type: string
          title: Locale
          description: BCP-47 locale. Drives the language of the agent's answer and
            the locale used when rendering card preview images. Defaults to en-US.
          default: en-US
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: IANA timezone (for example, 'America/New_York'). The agent
            uses it to render dates and times in card preview images. It does not
            affect the returned data.
        output_settings:
          anyOf:
          - $ref: '#/components/schemas/AgentOutputSettings'
          - type: 'null'
          description: Settings that control the response and rendering.
      type: object
      required:
      - query
      title: RetrievalAgentRunRequest
      description: Request body for POST /v1/agent/retrieval/runs.
    RetrievalAgentRunSummary:
      properties:
        run_id:
          type: string
          title: Run Id
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        created_at:
          type: string
          title: Created At
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread Id
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
        object:
          type: string
          const: agent.retrieval.run
          title: Object
          default: agent.retrieval.run
      type: object
      required:
      - run_id
      - status
      - created_at
      title: RetrievalAgentRunSummary
    RetrievalAgentStreamEnvelope:
      properties:
        seq:
          type: integer
          minimum: 0.0
          title: Seq
        run_id:
          type: string
          title: Run Id
        thread_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Thread Id
        category:
          $ref: '#/components/schemas/StreamCategory'
        block:
          oneOf:
          - $ref: '#/components/schemas/ToolCallEvent'
          - $ref: '#/components/schemas/ToolResultEvent'
          - $ref: '#/components/schemas/ToolErrorEvent'
          - $ref: '#/components/schemas/ToolRetryEvent'
          - $ref: '#/components/schemas/StatusEvent'
          - $ref: '#/components/schemas/SubagentEvent'
          - $ref: '#/components/schemas/ReasoningEvent'
          - $ref: '#/components/schemas/TextEvent'
          - $ref: '#/components/schemas/DataPipelineAnswerEvent'
          - $ref: '#/components/schemas/RetrievalAgentResultEvent'
          - $ref: '#/components/schemas/RunSummaryEvent'
          - $ref: '#/components/schemas/HeartbeatEvent'
          - $ref: '#/components/schemas/StreamResetEvent'
          - $ref: '#/components/schemas/StreamDoneEvent'
          title: Block
          discriminator:
            propertyName: kind
            mapping:
              agent_result: '#/components/schemas/RetrievalAgentResultEvent'
              data_pipeline_answer: '#/components/schemas/DataPipelineAnswerEvent'
              heartbeat: '#/components/schemas/HeartbeatEvent'
              reasoning: '#/components/schemas/ReasoningEvent'
              run_summary: '#/components/schemas/RunSummaryEvent'
              status: '#/components/schemas/StatusEvent'
              stream_done: '#/components/schemas/StreamDoneEvent'
              stream_reset: '#/components/schemas/StreamResetEvent'
              subagent: '#/components/schemas/SubagentEvent'
              text: '#/components/schemas/TextEvent'
              tool_call: '#/components/schemas/ToolCallEvent'
              tool_error: '#/components/schemas/ToolErrorEvent'
              tool_result: '#/components/schemas/ToolResultEvent'
              tool_retry: '#/components/schemas/ToolRetryEvent'
      type: object
      required:
      - seq
      - run_id
      - category
      - block
      title: RetrievalAgentStreamEnvelope
      description: 'Public SSE envelope for the Retrieval Agent run stream. It has
        the same

        wire shape as AgentStreamEnvelope. The only difference is that the

        terminal agent_result block carries RetrievalAgentResult (unified

        top-level citations, no web_results), so the SSE terminal matches the

        GET poll result.'
    RunSummaryEvent:
      properties:
        kind:
          type: string
          const: run_summary
          title: Kind
          default: run_summary
        status:
          $ref: '#/components/schemas/AgentRunStatus'
        created_at:
          type: string
          title: Created At
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorObject'
          - type: 'null'
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
      type: object
      required:
      - status
      - created_at
      title: RunSummaryEvent
      description: 'Terminal run metadata. The stream emits it once, immediately before

        stream_done. It mirrors the GET-poll run fields that the stream otherwise

        lacks; the result stays in the agent_result event. status, created_at,

        and completed_at are always present. error appears only on failure. usage

        appears only on metered (pay-as-you-go) runs and is null otherwise.

        agent_result plus run_summary equals the GET poll object.


        It carries the same envelope `seq` as the stream_done that follows it (it

        has no seq of its own), and the stream suppresses its SSE `id:`, so it

        advances no resume cursor. Identify it by `kind`; never assume `seq` is

        unique per frame.'
    SearchEffortLevel:
      type: string
      enum:
      - fast
      - instant
      - deep
      title: SearchEffortLevel
      description: 'Public effort taxonomy for search and answer. FAST is the default.

        INSTANT serves cached embeds without a new data retrieval and works in

        all environments. DEEP widens Tako retrieval and adds an LLM rerank for

        higher-quality results; it is slower and bills at a premium tier.'
    SearchRequest:
      properties:
        query:
          type: string
          title: Query
          description: Natural language search query.
          examples:
          - Intel vs Nvidia headcount since 2013
        effort:
          $ref: '#/components/schemas/SearchEffortLevel'
          description: 'Search effort level: ''fast'' (default), ''instant'', or ''deep''.'
          default: fast
        sources:
          $ref: '#/components/schemas/Sources'
          description: Per-source settings. The search includes an index only if its
            key is present. Defaults to {data:{}, web:{}} (data and web, count 5 each).
            Tako accepts the legacy key 'tako' as a synonym for 'data'.
        location:
          anyOf:
          - $ref: '#/components/schemas/GeoLocation'
          - type: 'null'
          description: Optional coordinates of the end user. Resolves the location
            for implicit-location queries (for example, weather). An explicit location
            in the query overrides these coordinates.
        country_code:
          type: string
          title: Country Code
          description: ISO 3166-1 alpha-2 country code for localization.
          default: US
        locale:
          type: string
          title: Locale
          description: BCP-47 locale tag for language and formatting.
          default: en-US
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
          description: IANA timezone (for example, 'America/New_York').
        output_settings:
          anyOf:
          - $ref: '#/components/schemas/OutputSettings'
          - type: 'null'
          description: Settings that control the response shape.
        include_related:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Include Related
          description: 'Applies to POST /v3/search only. Return follow-up query suggestions
            in `related`. Omit this field to disable them. The value sets the maximum
            number of suggestions, from 1 to 20. POST /v1/answer accepts this field
            but ignores it: the answer response has no `related` field.'
      additionalProperties: false
      type: object
      required:
      - query
      title: SearchRequest
      description: Shared request for POST /api/v3/search and POST /api/v1/answer.
    SearchResponse:
      properties:
        cards:
          items:
            $ref: '#/components/schemas/TakoCard'
          type: array
          title: Cards
        web_results:
          items:
            $ref: '#/components/schemas/WebResult'
          type: array
          title: Web Results
        request_id:
          type: string
          title: Request Id
        usage:
          anyOf:
          - $ref: '#/components/schemas/Usage'
          - type: 'null'
        related:
          anyOf:
          - items:
              $ref: '#/components/schemas/RelatedSuggestion'
            type: array
          - type: 'null'
          title: Related
          description: Follow-up queries you can run next. Set `include_related` on
            the request to receive them. Absent when you did not ask for them, or
            when Tako found none.
      type: object
      required:
      - request_id
      title: SearchResponse
    Sources:
      properties:
        data:
          anyOf:
          - $ref: '#/components/schemas/DataSourceSettings'
          - type: 'null'
          description: Tako data source (curated knowledge). The search includes it
            only if present. Tako accepts the legacy key 'tako' as a synonym.
        web:
          anyOf:
          - $ref: '#/components/schemas/WebSourceSettings'
          - type: 'null'
          description: Web source. The search includes it only if present.
      additionalProperties: false
      type: object
      title: Sources
      description: 'Per-source settings. The search includes an index only if its
        field is

        present.


        The Tako data source is named `data`. Tako still accepts the legacy key

        `tako` as a synonym and maps it to `data` before validation.'
    StatusEvent:
      properties:
        kind:
          type: string
          const: status
          title: Kind
          default: status
        message:
          type: string
          title: Message
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - message
      title: StatusEvent
    StreamCategory:
      type: string
      enum:
      - content
      - activity
      - control
      title: StreamCategory
    StreamDoneEvent:
      properties:
        kind:
          type: string
          const: stream_done
          title: Kind
          default: stream_done
      type: object
      title: StreamDoneEvent
    StreamResetEvent:
      properties:
        kind:
          type: string
          const: stream_reset
          title: Kind
          default: stream_reset
      type: object
      title: StreamResetEvent
    StructuredOutputStatus:
      type: string
      enum:
      - complete
      - partial
      - failed
      title: StructuredOutputStatus
      description: Terminal status of the structured-output channel.
    SubagentEvent:
      properties:
        kind:
          type: string
          const: subagent
          title: Kind
          default: subagent
        agent_id:
          type: string
          title: Agent Id
        subagent_type:
          type: string
          title: Subagent Type
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        event:
          type: string
          enum:
          - dispatch
          - complete
          title: Event
      type: object
      required:
      - agent_id
      - subagent_type
      - event
      title: SubagentEvent
    TakoCard:
      properties:
        card_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        semantic_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Semantic Description
        webpage_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Webpage Url
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        embed_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Embed Url
        sources:
          anyOf:
          - items:
              $ref: '#/components/schemas/TakoCardSource'
            type: array
          - type: 'null'
          title: Sources
        methodologies:
          anyOf:
          - items:
              $ref: '#/components/schemas/KnowledgeCardMethodology'
            type: array
          - type: 'null'
          title: Methodologies
        source_indexes:
          anyOf:
          - items:
              $ref: '#/components/schemas/TakoSourceIndex'
            type: array
          - type: 'null'
          title: Source Indexes
        card_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Type
        relevance:
          anyOf:
          - $ref: '#/components/schemas/KnowledgeCardRelevance'
          - type: 'null'
        content:
          anyOf:
          - $ref: '#/components/schemas/ResultContent'
          - type: 'null'
        exportable:
          type: boolean
          title: Exportable
          description: Whether the /contents endpoint can download this card's data.
            false means the export is not available; use the card's chart and inline
            preview instead. true means the export is eligible but not guaranteed;
            the /contents endpoint can still return 403, so fall back to the preview
            on error.
          default: false
        relevance_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Relevance Score
          description: Numeric relevance of this card to the query on a 1.0-5.0 scale
            (5.0 = exact match; higher is more relevant). Only populated for entitled
            accounts; null otherwise.
        nodes:
          anyOf:
          - items:
              $ref: '#/components/schemas/TakoCardNode'
            type: array
          - type: 'null'
          title: Nodes
          description: Graph nodes (entities and metrics) behind this card. The response
            includes them by default. Absent for web-only cards or when node resolution
            was not available. Use each id with /v1/graph/node/{id} for full detail
            (aliases, subtype), or pass ids in sources.data.node_ids to pin these
            nodes in future searches.
        metric_definitions:
          anyOf:
          - items:
              $ref: '#/components/schemas/MetricDefinition'
            type: array
          - type: 'null'
          title: Metric Definitions
          description: Definitions of the metrics this card displays (name + definition).
            Null when no displayed metric has a definition available.
        data_freshness:
          anyOf:
          - $ref: '#/components/schemas/DataFreshness'
          - type: 'null'
          description: 'Freshness dates for the card''s data: where the data ends
            (coverage_end), the same point as a full date (data_as_of, deprecated),
            and the last refresh date (last_updated). Null when no date is available.'
      type: object
      title: TakoCard
      description: 'A Tako knowledge card on the search and answer surfaces. It carries
        a

        `content` download descriptor.'
    TakoCardNode:
      properties:
        id:
          type: string
          title: Id
          description: Opaque, human-friendly public id (<prefix>::<name>::<hash>,
            where prefix is ent for an entity or mt for a metric). Ids are not durable
            across knowledge-graph rebuilds — resolve them at request time rather
            than storing them.
        type:
          $ref: '#/components/schemas/GraphNodeType'
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      type: object
      required:
      - id
      - type
      - name
      title: TakoCardNode
      description: 'Slim graph node for the search and answer card surface

        (TakoCard.nodes). It is deliberately narrower than GraphNode: it carries

        no `aliases` and no `subtype`. Callers that need the full node resolve

        the id via /v1/graph/node/{id}.'
    TakoCardSource:
      properties:
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
          description: The name of the source
          examples:
          - S&P Global
          - The World Bank
        source_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Description
          description: The description of the source
        source_index:
          $ref: '#/components/schemas/TakoSourceIndex'
          description: The index of the source
          examples:
          - data
          - web
        url:
          anyOf:
          - type: string
          - type: 'null'
          title: Url
          description: The URL of the source
          examples:
          - https://xignite.com
        source_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Text
          description: Raw excerpts retrieved from the source page — the unmodified
            web content that grounded the answer. Present for WEB sources; null for
            DATA sources.
      type: object
      required:
      - source_index
      title: TakoCardSource
      description: 'A source that backs a TakoCard on the SDK surfaces. It uses the

        {data, web} TakoSourceIndex taxonomy.'
    TakoDatasetColumn:
      properties:
        name:
          type: string
          title: Name
          description: Column name.
        type:
          $ref: '#/components/schemas/TakoDatasetColumnType'
          description: 'Logical column type: ''string'', ''number'', ''boolean'',
            ''date'', or ''datetime''. Temporal cells are ISO-8601 strings.'
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
          description: Structured unit for the column values, e.g. 'USD billions',
            '%'. Null when unitless.
      type: object
      required:
      - name
      - type
      title: TakoDatasetColumn
      description: Typed header entry; `type` is the JSON-facing column type.
    TakoDatasetColumnType:
      type: string
      enum:
      - string
      - number
      - boolean
      - date
      - datetime
      title: TakoDatasetColumnType
      description: 'Logical column type declared in a TakoDataset header. Temporal
        cells

        are ISO-8601 strings. Each column declares ''date'' or ''datetime'' on its

        own: a temporal column whose non-null values are all timezone-naive

        midnights declares ''date''.'
    TakoDatasetSource:
      properties:
        name:
          type: string
          title: Name
          description: Human-readable source name (e.g. 'FRED', 'S&P Global').
        index:
          type: string
          enum:
          - data
          - web
          title: Index
          description: 'Source index the rows came from: ''data'' (Tako) or ''web''.'
          default: data
      type: object
      required:
      - name
      title: TakoDatasetSource
      description: 'Per-dataset provenance entry. `index` names the source index,
        not a

        citation display number. It is "data" for every dataset today — web

        content never fills a dataset slot.'
    TakoSourceIndex:
      type: string
      enum:
      - data
      - web
      title: TakoSourceIndex
      description: 'Public source taxonomy for the SDK card surfaces (v3 search, v1
        answer,

        agent). It is symmetric with the request taxonomy {data, web}.'
    TextEvent:
      properties:
        kind:
          type: string
          const: text
          title: Kind
          default: text
        id:
          type: string
          title: Id
        delta:
          type: string
          title: Delta
        done:
          type: boolean
          title: Done
          default: false
      type: object
      required:
      - id
      - delta
      title: TextEvent
    ThinVizCard:
      properties:
        card_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Id
          description: Public ID of the created card.
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Card title.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Card description.
        webpage_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Webpage Url
          description: Hosted page URL for the card.
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
          description: Static preview image URL for the card.
        embed_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Embed Url
          description: Embeddable URL for the card.
        card_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Card Type
          description: The card's chart type (for example, 'bar').
        visualization_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Visualization Data
          description: Inline chart config + data for rendering the card.
          examples:
          - data:
            - x: '2013'
              y: 10000
            viz_config:
              title: Revenue
        embed_mode:
          anyOf:
          - type: string
            enum:
            - post
            - postmessage
          - type: 'null'
          title: Embed Mode
          description: 'How Tako delivers the embed: ''postmessage'' for postMessage
            embeds, and ''post'' otherwise.'
      type: object
      title: ThinVizCard
      description: 'Response for POST /api/v1/thin_viz/create — a created visualization
        card.


        Distinct from KnowledgeCard: thin_viz builds a self-contained chart from

        a caller-supplied component schema, so it never carries retrieval

        provenance (sources, source_indexes) or downloadable raw data. Render the

        card via `embed_url` and preview it via `image_url`.

        `visualization_data` carries the inline chart config and data.


        This schema documents the populated subset of the response. The wire

        payload also includes the remaining KnowledgeCard fields (sources,

        source_indexes, methodologies, data_url, and so on) as null.'
    ToolCallEvent:
      properties:
        kind:
          type: string
          const: tool_call
          title: Kind
          default: tool_call
        id:
          type: string
          title: Id
        tool:
          type: string
          title: Tool
        status_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Message
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        done:
          type: boolean
          title: Done
          default: false
      type: object
      required:
      - id
      - tool
      title: ToolCallEvent
    ToolErrorEvent:
      properties:
        kind:
          type: string
          const: tool_error
          title: Kind
          default: tool_error
        id:
          type: string
          title: Id
        tool:
          type: string
          title: Tool
        error:
          type: string
          title: Error
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - id
      - tool
      - error
      title: ToolErrorEvent
    ToolResultEvent:
      properties:
        kind:
          type: string
          const: tool_result
          title: Kind
          default: tool_result
        id:
          type: string
          title: Id
        tool:
          type: string
          title: Tool
        elapsed_ms:
          type: integer
          title: Elapsed Ms
          default: 0
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - id
      - tool
      title: ToolResultEvent
    ToolRetryEvent:
      properties:
        kind:
          type: string
          const: tool_retry
          title: Kind
          default: tool_retry
        id:
          type: string
          title: Id
        tool:
          type: string
          title: Tool
        error:
          type: string
          title: Error
        elapsed_ms:
          type: integer
          title: Elapsed Ms
          default: 0
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
      type: object
      required:
      - id
      - tool
      - error
      title: ToolRetryEvent
    Usage:
      properties:
        total_cost_usd:
          type: number
          title: Total Cost Usd
          description: Total quoted USD cost of this request. Sum of compute cost
            and data cost.
        compute:
          anyOf:
          - $ref: '#/components/schemas/UsageCompute'
          - type: 'null'
          description: Compute cost breakdown. Present only on surfaces with a compute
            step (absent for contents).
        data:
          anyOf:
          - $ref: '#/components/schemas/UsageData'
          - type: 'null'
          description: Inline-data cost breakdown. Present only when the surface emitted
            billable inline data.
      type: object
      required:
      - total_cost_usd
      title: Usage
      description: 'Usage for one metered request. `total_cost_usd` is always present
        (the

        total quoted charge). `compute` and `data` are the additive breakdown;

        each appears only where it applies. total_cost_usd always equals the sum

        of the components that appear.'
    UsageCompute:
      properties:
        cost_usd:
          type: number
          title: Cost Usd
          description: USD cost of running the operation.
      type: object
      required:
      - cost_usd
      title: UsageCompute
      description: 'The cost of running the operation. Absent on surfaces with no
        compute

        step (contents).'
    UsageData:
      properties:
        cost_usd:
          type: number
          title: Cost Usd
          description: USD cost of the inline data delivered in the response.
        datasets:
          type: integer
          title: Datasets
          description: Number of billed data units (datasets) included in the response.
      type: object
      required:
      - cost_usd
      - datasets
      title: UsageData
      description: 'The cost and quantity of inline data delivered in the response:
        the

        agent per-dataset surcharge, the search and answer include_contents

        charge, or the contents per-item cost. `datasets` is the count of billed

        data units. Absent when the surface did not or cannot emit inline data

        (for example, the answer agent).'
    WebCategory:
      type: string
      enum:
      - news
      - sports
      - finance
      title: WebCategory
      description: 'Web search category filter. Only ''news'' maps to a provider category

        today; ''sports'' and ''finance'' are accepted but have no effect yet.'
    WebResult:
      properties:
        title:
          type: string
          title: Title
          description: Title of the web page.
        url:
          type: string
          title: Url
          description: URL of the web page.
        snippet:
          anyOf:
          - type: string
          - type: 'null'
          title: Snippet
          description: Excerpt(s) from the page that matched the query.
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
          description: Publisher or domain name, when Tako can extract it from the
            URL.
        publish_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Publish Date
          description: Publication date of the page, when available.
        content:
          anyOf:
          - $ref: '#/components/schemas/ResultContent'
          - type: 'null'
          description: Downloadable content descriptor for this result, fetched via
            the Contents endpoint. Web results are always downloadable as text. None
            for callers that do not populate it.
        citation_number:
          anyOf:
          - type: integer
          - type: 'null'
          title: Citation Number
          description: 1-based citation number that the answer's inline [N] markers
            reference. Set only when the answer inline-cites this result (the Agent
            API); None on raw-retrieval surfaces.
      type: object
      required:
      - title
      - url
      title: WebResult
      description: 'A single raw web search result from the WEB source index.


        Distinct from `KnowledgeCardSource` (a citation inside a synthesized

        answer) and `KnowledgeCard` (a Tako visualization). Web results are

        raw retrieval output — title, URL, optional snippet. They do not depend

        on any LLM synthesis that may also happen over them.'
    WebSourceSettings:
      properties:
        count:
          anyOf:
          - type: integer
            maximum: 20.0
            minimum: 1.0
          - type: 'null'
          title: Count
          description: Maximum number of results to return for this source. The range
            is 1 to 20. If you omit this field, the search endpoint returns 5 results
            and the answer endpoint returns 3.
        include_contents:
          type: boolean
          title: Include Contents
          description: Inline this source's underlying data directly in the response.
            For the Tako data source, that is serialized card data (see content_format).
            For web results, that is the extracted text.
          default: false
        category:
          anyOf:
          - $ref: '#/components/schemas/WebCategory'
          - type: 'null'
          description: Restrict web results to a category. 'news' filters to news
            sources. 'sports' and 'finance' are accepted but have no effect yet. Omit
            for a general web search.
        include_domains:
          items:
            type: string
          type: array
          maxItems: 20
          title: Include Domains
          description: Return only results from these domains (bare hosts, for example
            'cnn.com'). Max 20.
        exclude_domains:
          items:
            type: string
          type: array
          maxItems: 20
          title: Exclude Domains
          description: Drop results from these domains (bare hosts, for example 'cnn.com').
            Max 20.
        snippet_max_chars:
          anyOf:
          - type: integer
            maximum: 20000.0
            minimum: 1.0
          - type: 'null'
          title: Snippet Max Chars
          description: Character cap on the text excerpt returned per web result.
            If you omit this field, the search endpoint applies 4000 and the answer
            endpoint applies 1000. If you send a value, the server uses that value
            exactly. The maximum is 20000.
        highlights:
          type: boolean
          title: Highlights
          description: 'Return query-relevant highlight passages as each web result''s
            snippet, instead of the opening text of the page. Highlights usually carry
            the answer-bearing sentences, and stay within snippet_max_chars. Tako
            requests no page text when this field is true, so a page with no highlight
            returns snippet: null. The snippet can also hold more than one passage
            from different parts of the page, joined by '' … ''. Read the snippet
            as a whole. Do not cut the snippet to a fixed length. Do not quote the
            snippet as one continuous sentence. Default false.'
          default: false
        article_content_max_chars:
          type: integer
          maximum: 1000000.0
          minimum: 1.0
          title: Article Content Max Chars
          description: Character cap on the full article text when include_contents
            is true. Default 30000, maximum 1000000.
          default: 30000
        published_after:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Published After
          description: Keep only web results published on or after this date (ISO
            'YYYY-MM-DD'). Tako applies the date on the provider where possible, and
            always filters the returned results. Results with no known publication
            date are kept. Omit for no lower bound.
        published_before:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Published Before
          description: Keep only web results published on or before this date (ISO
            'YYYY-MM-DD'). Results with no known publication date are kept. Omit for
            no upper bound.
      additionalProperties: false
      type: object
      title: WebSourceSettings
      description: 'Web source settings. Adds category, domain filters, and character
        caps

        on top of the base count and include_contents.'
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
